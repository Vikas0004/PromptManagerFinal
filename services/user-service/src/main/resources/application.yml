server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/promptmanager}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}                            
    password: ${SPRING_DATASOURCE_PASSWORD:root}                             
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update     
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    #hostname: localhost
    instance-id: user-service:8081
    #prefer-ip-address: false
    #hostname: user-service-promptmanager.microservice-namespace
    #non-secure-port: 8081  

