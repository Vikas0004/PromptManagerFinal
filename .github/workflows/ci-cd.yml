name: PromptManager CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-java-services:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - eureka-server
          - api-gateway
          - user-service
          - prompt-service
          - analytics-service

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Spring Boot Service
        working-directory: ./services/${{ matrix.service }}
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        working-directory: ./services/${{ matrix.service }}
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}-promptmanagerfinal:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}-promptmanagerfinal:latest


  # ============================================
  # BUILD + PUSH PYTHON SERVICES
  # ============================================

  build-python-services:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - preprocessing-service
          - ml-service
          - llm-service

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: ./services/${{ matrix.service }}
        run: |
          pip install -r requirements.txt

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        working-directory: ./services/${{ matrix.service }}
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}-promptmanagerfinal:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}-promptmanagerfinal:latest


  # ============================================
  # BUILD + PUSH FRONTEND
  # ============================================

  build-frontend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./frontend-svelte/prompt-manager-ui
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend-svelte/prompt-manager-ui
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Docker Image
        working-directory: ./frontend-svelte/prompt-manager-ui
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/svelte-frontend-promptmanagerfinal:latest .

      - name: Push Frontend Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/svelte-frontend-promptmanagerfinal:latest